apply plugin: 'com.android.application'

// The coach service's address and token, kept out of the repository and given to debug builds only.
// A build without them has no coach.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
// Both become string resources, where a leading @ or ? is a reference and a quote breaks the file.
['coach.url', 'coach.token'].each { key ->
    def value = localProperties.getProperty(key, '')
    if (!(value ==~ /[A-Za-z0-9._~:\/=+-]*/)) {
        throw new GradleException("local.properties: $key holds a character a string resource cannot carry")
    }
}

android {
    defaultConfig {
        applicationId "com.cube.nanotimer"
        minSdkVersion 21
        compileSdkVersion 36
        targetSdkVersion 36
        versionCode 71
        versionName project.property('cubenchVersion')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            // Separate package so the debug build installs alongside the release app without
            // touching it or its data.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue 'string', 'coach_url', localProperties.getProperty('coach.url', '')
            resValue 'string', 'coach_token', localProperties.getProperty('coach.token', '')
        }
        release {
            // No coach in a release until each install has its own identity (C2): a token here
            // would be one shared by every Play user, and readable out of the APK.
            resValue 'string', 'coach_url', ''
            resValue 'string', 'coach_token', ''
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.cube.nanotimer'
    sourceSets {
        // The recorded blind solves are read from both modules' tests: the detectors name their
        // algorithms here, and the reconstruction spells them there.
        test.java.srcDirs += '../testfixtures/java'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.webkit:webkit:1.12.1' // WebViewAssetLoader for the scramble diagram
    implementation 'com.google.android.play:review:2.0.2' // Play In-App Review API

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013' // android.jar's org.json is a stub in unit tests

    implementation project(':datamodel')
    implementation project(':guilib')
    implementation project(':services')
    implementation project(':smartcube')
    
    implementation 'asia.ivity.android:drag-sort-listview:1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
